    <rect x="4" y="4" width="56" height="56" rx="8" fill="#2e2e2e" stroke="#000000" stroke-width="2.5"/>
    <rect x="11" y="11" width="42" height="42" rx="4" fill="none" stroke="#9e9e9e" stroke-width="5"/>
    <line x1="11" y1="53" x2="53" y2="11" stroke="#9e9e9e" stroke-width="5" stroke-linecap="round"/>
    <path d="M4 44 A16 16 0 0 1 20 60 L12 60 Q4 60 4 52Z" fill="#cfcfcf" stroke="#000000" stroke-width="2"/>
    <path d="M44 4 A16 16 0 0 0 60 20 L60 12 Q60 4 52 4Z" fill="#cfcfcf" stroke="#000000" stroke-width="2"/>
  </g>
  <!-- Big exclamation point -->
